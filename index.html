<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Dota 2 Profile Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Поиск игрока Dota 2</h2>
    <div class="search-box">
      <input type="text" id="playerId" placeholder="Введите Account ID Steam">
      <button onclick="getDotaStats()">Проверить Dotabuff</button>
    </div>
    
    <div id="result" class="result-box"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
